name: Documentation
description: Report unclear, missing, or incorrect docs
title: "[Docs]: "
labels: ["documentation", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Help us improve README, Storybook, CHANGELOG, or inline docs.

  - type: textarea
    id: location
    attributes:
      label: Where is the issue?
      description: File path, Storybook story name, or npm/README section.
      placeholder: README "Usage" section / Storybook "Keyboard" story
    validations:
      required: true

  - type: textarea
    id: issue
    attributes:
      label: What is wrong or missing?
      description: Be specific about what confused you or what should be added.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: Wording, example code, or structure you would find helpful.

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates
          required: true
