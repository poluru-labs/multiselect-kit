name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Clear use cases help us prioritize and design APIs that stay accessible and framework-agnostic.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem are you trying to solve? Who is affected?
      placeholder: We need to limit selections without disabling the whole control…
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like this to work? API shape, UX, or behavior is helpful.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or libraries you evaluated.

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Public API / props / events
        - Keyboard or interaction model
        - Accessibility
        - Styling / customization
        - Documentation / Storybook
        - Developer experience (build, types)
        - Other
    validations:
      required: true

  - type: checkboxes
    id: breaking
    attributes:
      label: Compatibility
      options:
        - label: This would require a breaking change for existing consumers
        - label: This can be added in a backward-compatible way

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Mockups, links, or examples from other design systems.

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for similar requests
          required: true
